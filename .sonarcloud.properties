# Org policy: Cap-go workflows use latest major action tags, not commit SHAs
# (githubactions:S7637), and example-app deploys run the latest first-party
# @capgo/cli on purpose (githubactions:S8543). Automatic analysis does not
# support sonar.issue.ignore.multicriteria, so workflows are excluded (same as
# capacitor-inappbrowser#734).
sonar.exclusions=.github/workflows/**
