appId: ${APP_ID}
---
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Maestro Ready"
    timeout: 240000
- tapOn:
    text: "Run Visual Regression (Maestro)"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Visual regression ready"
    timeout: 120000
- extendedWaitUntil:
    visible: "Layout probe"
    timeout: 60000