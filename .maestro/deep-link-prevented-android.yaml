appId: app.capgo.inappbrowser
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- tapOn:
    text: 'Wait'
    optional: true
    label: 'Dismiss the transient Pixel Launcher ANR dialog before waiting for the harness'
- extendedWaitUntil:
    visible: 'InAppBrowser Test App'
    timeout: 20000
- repeat:
    times: 16
    while:
      notVisible: 'Maestro Ready'
    commands:
      - tapOn:
          text: 'Wait'
          optional: true
      - extendedWaitUntil:
          visible: 'Maestro Ready'
          timeout: 15000
          optional: true
- extendedWaitUntil:
    visible: 'Maestro Ready'
    timeout: 120000
- tapOn:
    id: 'maestro-run-deep-link-prevented'
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: 'Deep link prevented regression passed'
    timeout: 120000
- assertVisible: 'Event OK: capgo-maestro-deeplink://blocked'
- assertVisible: 'Negative OK: https produced no deepLinkPrevented'
- assertVisible: 'InAppBrowser Test App'