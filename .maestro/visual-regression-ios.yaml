appId: ${APP_ID}
env:
  THRESHOLD_PERCENTAGE: 97
---
- launchApp:
    clearState: true
- tapOn:
    text: "QA tools (Maestro regression)"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Maestro Ready"
    timeout: 240000
- extendedWaitUntil:
    visible: "Run Visual Regression (Maestro)"
    timeout: 240000
- tapOn:
    text: "Run Visual Regression (Maestro)"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Visual regression ready"
    timeout: 120000
- extendedWaitUntil:
    visible: "Layout probe"
    timeout: 60000
- assertScreenshot:
    path: visual-regression/baselines/ios/blank-toolbar-layout.png
    thresholdPercentage: ${THRESHOLD_PERCENTAGE}