appId: ${APP_ID}
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Maestro Ready"
    timeout: 240000
- scrollUntilVisible:
    element:
      text: "Run Visual Regression (Maestro)"
- tapOn:
    text: "Run Visual Regression (Maestro)"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Visual regression ready"
    timeout: 120000
- extendedWaitUntil:
    visible: "Layout probe"
    timeout: 60000
- takeScreenshot: visual-regression/baselines/android/blank-toolbar-layout.png