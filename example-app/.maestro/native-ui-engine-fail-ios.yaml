appId: ${APP_ID}
name: Native UI Engine rejects missing projection selector (iOS)
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Maestro Ready"
    timeout: 120000
- tapOn:
    text: "Run Native UI Engine Fail (Maestro)"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Native UI engine validation failed as expected"
    timeout: 120000