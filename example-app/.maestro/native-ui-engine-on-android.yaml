appId: ${APP_ID}
name: Native UI Engine on registers openWebView toolbar
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Maestro Ready"
    timeout: 120000
- tapOn:
    id: "maestro-run-native-ui-engine-on"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Native UI engine on passed"
    timeout: 120000