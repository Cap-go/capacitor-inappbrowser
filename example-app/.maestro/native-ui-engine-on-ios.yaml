appId: ${APP_ID}
name: Native UI Engine on registers openWebView toolbar (iOS)
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Maestro Ready"
    timeout: 120000
- tapOn:
    text: "Run Native UI Engine On (Maestro)"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Native UI engine on passed"
    timeout: 120000