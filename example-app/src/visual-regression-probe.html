<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Visual Layout Probe</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        background: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #visual-regression-probe {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 100%;
      }

      .stripe-top {
        height: 56px;
        background: #2563eb;
        flex-shrink: 0;
      }

      .stripe-bottom {
        height: 48px;
        background: #dc2626;
        flex-shrink: 0;
      }

      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #22c55e;
        padding: 24px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        color: #052e16;
        text-align: center;
      }

      p {
        margin: 12px 0 0;
        color: #14532d;
        text-align: center;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="visual-regression-probe">
      <div class="stripe-top" aria-hidden="true"></div>
      <main>
        <div>
          <h1>Layout probe</h1>
          <p id="visual-regression-ready-label">Visual regression ready</p>
        </div>
      </main>
      <div class="stripe-bottom" aria-hidden="true"></div>
    </div>
    <script>
      (function () {
        const postReady = () => {
          if (window.mobileApp && typeof window.mobileApp.postMessage === "function") {
            window.mobileApp.postMessage({
              detail: {
                type: "visualRegressionReady",
                probeHeight: document.getElementById("visual-regression-probe")?.offsetHeight ?? null,
              },
            });
          }
        };

        window.requestAnimationFrame(() => {
          window.requestAnimationFrame(postReady);
        });
      })();
    </script>
  </body>
</html>
